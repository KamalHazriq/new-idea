name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing useful, so don't pay for it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suites drive a real browser at real speed; ~9 minutes is normal and
    # the cap is only here to stop a hung browser burning a whole hour.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: the lockfile is what makes the browser cache
      # key below correspond to the Playwright actually being installed.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Keyed on the lockfile, not package.json. package.json holds a caret
      # range — today "^1.56.0" resolves to 1.62.1 — so hashing it would let a
      # newer Playwright be installed against an older cached browser build,
      # which fails every run until something unrelated busts the key.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # System libraries are needed on every fresh runner, cache hit or not.
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium

      # Idempotent — a fast no-op when the cache already holds the right build,
      # and a second line of defence if the key ever goes stale anyway.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run tests
        run: npm test
